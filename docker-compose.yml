name: palmprint-research

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: palmprint
      POSTGRES_USER: palmprint
      POSTGRES_PASSWORD: palmprint_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palmprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    environment:
      ML_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_ARTIFACT_DIR: /app/data/artifacts
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
    volumes:
      - ml_artifacts:/app/data/artifacts
      - ml_models:/app/models
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://palmprint:palmprint_dev@postgres:5432/palmprint
      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/data/storage
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT: "60.0"
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
      AUTH_ENABLED: "false"
      DEMO_MODE: "true"
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_storage:/app/data/storage
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  ml_artifacts:
  ml_models:
  backend_storage:
  backend_data:
